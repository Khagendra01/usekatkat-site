<!doctype html>
<html>
  <head>
    <title>Render Logo</title>
  </head>
  <body
    style="
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      font-family: sans-serif;
      color: #fff;
    "
  >
    <canvas id="canvas"></canvas>
    <div style="margin-top: 1rem; display: flex; gap: 1rem; align-items: center">
      <label
        >Size: <input id="size" type="number" value="2048" min="300" max="4096" style="width: 80px"
      /></label>
      <button onclick="render()" style="padding: 8px 20px; cursor: pointer">Render</button>
      <button onclick="download()" style="padding: 8px 20px; cursor: pointer">Download PNG</button>
    </div>
    <script>
      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
      <rect width="512" height="512" fill="#ffffff" />
      <g transform="translate(256 256) scale(14) translate(-12 -12)" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M5 4l8 8-8 8z" />
        <path d="M14 4l5 8-5 8" />
      </g>
    </svg>`;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      function render() {
        const size = parseInt(document.getElementById("size").value) || 1200;
        canvas.width = size;
        canvas.height = size;

        const img = new Image();
        const blob = new Blob([svgContent], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          ctx.clearRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }

      function download() {
        const link = document.createElement("a");
        link.download = "katkat-logo-linkedin.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      render();
    </script>
  </body>
</html>
